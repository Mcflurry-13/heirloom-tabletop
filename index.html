html, body { margin: 0; height: 100%; overflow: hidden; background: linear-gradient(180deg, #A9A5D2 0%, #BCB6E1 46%, #E6D8EB 100%); touch-action: none; overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
#stage { position: absolute; left: 0; top: 0; width: 1194px; height: 834px; transform-origin: 0 0; }
button:focus-visible { outline: 2px solid #5B4FA0; outline-offset: 2px; }
img { -webkit-user-drag: none; user-select: none; }
noscript { position: absolute; left: 24px; top: 24px; font: 16px sans-serif; color: #2F2A55; }
#mode-control { position: fixed; z-index: 50; top: max(14px, env(safe-area-inset-top)); left: max(14px, env(safe-area-inset-left)); font: 13px 'Instrument Sans', sans-serif; color: #2F2A55; }
#mode-switch { display: flex; gap: 3px; padding: 4px; border: 1px solid rgba(255,255,255,.7); border-radius: 22px; background: rgba(250,247,255,.78); box-shadow: 0 6px 20px rgba(47,42,85,.14); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
#mode-switch button { min-height: 38px; padding: 0 13px; border: 0; border-radius: 18px; color: #4E4880; background: transparent; font: inherit; cursor: pointer; }
#mode-switch button[aria-pressed="true"] { background: #5B4FA0; color: white; }
#api-panel { display: none; width: min(330px, calc(100vw - 28px)); box-sizing: border-box; margin-top: 8px; padding: 14px; border-radius: 18px; background: rgba(250,247,255,.95); box-shadow: 0 8px 30px rgba(47,42,85,.17); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); }
#api-panel.is-open { display: block; }
#api-panel label { display: block; margin-bottom: 7px; font-weight: 600; }
#api-story { display: block; width: 100%; height: 80px; box-sizing: border-box; resize: vertical; border: 1px solid #c9c3e2; border-radius: 10px; padding: 9px; background: white; color: #2F2A55; font: 14px/1.4 'Instrument Sans', sans-serif; user-select: text; -webkit-user-select: text; touch-action: auto; }
#api-actions { display: flex; gap: 6px; margin-top: 9px; }
#api-actions button { flex: 1; min-height: 38px; border: 1px solid #aaa0d3; border-radius: 18px; background: white; color: #4E4880; font: inherit; cursor: pointer; }
#api-actions button.primary { background: #5B4FA0; color: white; border-color: #5B4FA0; }
#api-actions button:disabled { opacity: .45; cursor: default; }
#api-status { min-height: 34px; margin: 8px 0 0; font-size: 12px; line-height: 1.4; color: #4E4880; }
</style>
</head>
<body>
<div id="stage"></div>
<div id="mode-control" aria-label="Prototype mode">
  <div id="mode-switch"><button type="button" id="wizard-mode" aria-pressed="true">Wizard of Oz</button><button type="button" id="api-mode" aria-pressed="false">AI / API</button></div>
  <div id="api-panel"><label for="api-story">Family story</label><textarea id="api-story">今天是中秋节，我们自己做了月饼。你在美国怎么样？有没有吃月饼呀？我们想你啦！</textarea><div id="api-actions"><button type="button" id="api-record">Record voice</button><button type="button" class="primary" id="api-generate">Generate</button></div><p id="api-status" role="status" aria-live="polite">Type a memory or record a voice, then generate.</p></div>
</div>

<sc-for list="{{mshards}}" as="m" hint-placeholder-count="5">
<div style="position: absolute; left: {{m.x}}px; top: {{m.y}}px; width: {{m.w}}px; height: {{m.h}}px; z-index: {{m.z}}; transform: translate({{m.tx}}px, {{m.ty}}px)">
<button type="button" aria-label="{{m.label}}" onPointerDown="{{m.down}}" onPointerMove="{{m.move}}" onPointerUp="{{m.up}}" onPointerCancel="{{m.up}}" onPointerLeave="{{m.leave}}" onClick="{{m.click}}" style="position: relative; display: block; width: {{m.w}}px; height: {{m.h}}px; padding: 0; border: none; background: transparent; cursor: grab; touch-action: none; transform: rotateX({{m.rx}}deg) rotateY({{m.ry}}deg) scale({{m.sc}}); filter: drop-shadow(0 {{m.sy1}}px 5px rgba(72, 60, 140, 0.3)) drop-shadow(0 {{m.sy2}}px 14px rgba(72, 60, 140, 0.2)) drop-shadow(0 0 12px {{m.glow}})">
<div style="position: absolute; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; transform: translate(1.5px, 3.5px); background: linear-gradient(165deg, #F3EADC, #C7B8A0); clip-path: {{m.clip}}"></div>
<div style="position: relative; width: 100%; height: 100%; overflow: hidden; clip-path: {{m.clip}}; background: #F2E7D5">
<img draggable="false" src="{{m.img}}" alt="" style="position: absolute; left: {{m.il}}%; top: {{m.it}}%; width: {{m.iw}}%; height: {{m.ih}}%; max-width: none">
<div style="position: absolute; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; background-image: linear-gradient(158deg, rgba(255, 255, 255, 0.34) 0%, rgba(255, 255, 255, 0) 32%, rgba(255, 255, 255, 0) 70%, rgba(255, 255, 255, 0.14) 100%)"></div>
<div style="position: absolute; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; mix-blend-mode: screen; opacity: {{m.spec}}; background-image: radial-gradient(circle at {{m.gx}}% {{m.gy}}%, rgba(255, 255, 255, 0.95) 0%, rgba(255, 255, 255, 0.55) 6%, rgba(255, 255, 255, 0) 45%)"></div>
</div>
</button>
</div>
</sc-for>
</div>
<div style="position: absolute; left: 899px; top: 616px; width: 293px; text-align: center; font-size: 12.5px; line-height: 1.4; color: #4E4880; pointer-events: none"><div>Each record is a shard;</div><div>together they rebuild the vase</div></div>
</sc-if>
<sc-if value="{{show.wizard}}" hint-placeholder-val="{{ true }}">
<div style="position: absolute; right: 16px; bottom: 12px; display: flex; align-items: center; gap: 4px; padding: 6px 8px 6px 14px; border-radius: 30px; background: rgba(255, 255, 255, 0.5); border: 1px solid rgba(255, 255, 255, 0.75); box-shadow: 0 10px 28px rgba(72, 60, 140, 0.16); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px)">
<div style="padding-right: 4px; font-size: 10.5px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: #4E4880">Wizard</div>
<sc-for list="{{steps}}" as="b" hint-placeholder-count="6">
<button type="button" onClick="{{b.go}}" style="height: 44px; padding: 0 11px; border: none; border-radius: 22px; background: {{b.bg}}; color: {{b.fg}}; font: inherit; font-size: 13px; font-weight: 500; cursor: pointer">{{b.label}}</button>
</sc-for>
<sc-if value="{{show.turn}}" hint-placeholder-val="{{ false }}">
<div style="width: 1px; height: 24px; background: rgba(47, 42, 85, 0.16)"></div>
<button type="button" onClick="{{turn.ccw}}" aria-label="Turn the vase counterclockwise, toward newer records" style="width: 44px; height: 44px; border: none; border-radius: 22px; background: transparent; color: #2F2A55; font: inherit; font-size: 18px; cursor: pointer">↺</button>
<button type="button" onClick="{{turn.cw}}" aria-label="Turn the vase clockwise, toward older records" style="width: 44px; height: 44px; border: none; border-radius: 22px; background: transparent; color: #2F2A55; font: inherit; font-size: 18px; cursor: pointer">↻</button>
</sc-if>
<div style="width: 1px; height: 24px; background: rgba(47, 42, 85, 0.16)"></div>
<sc-for list="{{hands}}" as="hb" hint-placeholder-count="3">
<button type="button" onClick="{{hb.go}}" aria-pressed="{{hb.pressed}}" style="height: 44px; padding: 0 8px; border: none; border-radius: 22px; background: {{hb.bg}}; color: #2F2A55; font: inherit; font-size: 13px; cursor: pointer">{{hb.label}}</button>
</sc-for>
<button type="button" onClick="{{mic.go}}" aria-pressed="{{mic.pressed}}" style="height: 44px; padding: 0 9px; border: none; border-radius: 22px; background: {{mic.bg}}; color: #2F2A55; font: inherit; font-size: 13px; cursor: pointer; white-space: nowrap">{{mic.label}}</button>
<div style="width: 1px; height: 24px; background: rgba(47, 42, 85, 0.16)"></div>
<button type="button" onClick="{{reset}}" style="height: 44px; padding: 0 11px; border: none; border-radius: 22px; background: {{resetBg}}; color: {{resetFg}}; font: inherit; font-size: 13px; cursor: pointer">Reset</button>
</div>
</sc-if>
</div>
